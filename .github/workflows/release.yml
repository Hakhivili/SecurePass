name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, for example v0.1.0'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS / Linux 尚未在真机验证，0.1.0 与 0.2.0 只发布 Windows 产物；
        # 待 `docs/ROADMAP.zh-CN.md` 的 M1/M3 验收覆盖后，再把 macos-latest 与 ubuntu-latest 加回来。
        os: [windows-latest]
    # 签名材料全部来自 secrets；没有配置时下面的步骤自动跳过，产物与未签名构建一致。
    # 说明见 docs/SIGNING.zh-CN.md。
    env:
      WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      MAC_CERT: ${{ secrets.MAC_CERT_PFX_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 让 package.json 的版本与即将发布的 tag 保持一致（0.1.0 ← v0.1.0）
      - name: Sync version
        shell: bash
        run: npm pkg set version="${VERSION#v}"

      - name: Prepare signing material (Windows)
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERT != ''
        shell: bash
        run: |
          echo "$WINDOWS_CERT" | base64 --decode > "$RUNNER_TEMP/securepass-win.pfx"
          echo "CSC_LINK=$RUNNER_TEMP/securepass-win.pfx" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$WINDOWS_CERT_PASSWORD" >> "$GITHUB_ENV"

      - name: Prepare signing material (macOS)
        if: matrix.os == 'macos-latest' && env.MAC_CERT != ''
        shell: bash
        run: |
          echo "$MAC_CERT" | base64 --decode > "$RUNNER_TEMP/securepass-mac.p12"
          echo "CSC_LINK=$RUNNER_TEMP/securepass-mac.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
          # 有证书时同时打开公证
          echo "NOTARIZE_FLAG=--config.mac.notarize=true" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: npm run package -- $NOTARIZE_FLAG
        env:
          # 没有导入证书时不要自动发现系统里的陌生签名身份
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_CERT != '' || env.WINDOWS_CERT != '' }}

      - name: Verify signature (Windows)
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERT != ''
        shell: pwsh
        run: |
          $file = Get-ChildItem release/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $file.FullName
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "Signature is not valid: $($sig.Status)" }

      - name: Verify signature (macOS)
        if: matrix.os == 'macos-latest' && env.MAC_CERT != ''
        shell: bash
        run: |
          app=$(find release -maxdepth 3 -name 'SecurePass.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Strip unpacked directory
        shell: bash
        run: rm -rf release/*-unpacked release/*.blockmap release/*.app release/builder-*.yml

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: release/**
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      # 需要仓库内的 docs/release-notes/<tag>.md 作为发布说明
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          ls -l
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort |
            while read -r file; do sha256sum "$file" >> SHA256SUMS.txt; done
          cat SHA256SUMS.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 有 docs/release-notes/<tag>.md 就用它，否则让 GitHub 依据提交生成
          if [ -f "docs/release-notes/${VERSION}.md" ]; then
            HAS_NOTES=1
          else
            HAS_NOTES=0
          fi

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, refreshing notes and assets"
            if [ "$HAS_NOTES" = "1" ]; then
              gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" \
                --notes-file "docs/release-notes/${VERSION}.md"
            fi
          else
            if [ "$HAS_NOTES" = "1" ]; then
              gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
                --title "SecurePass $VERSION" \
                --notes-file "docs/release-notes/${VERSION}.md" --target "$GITHUB_SHA"
            else
              gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
                --title "SecurePass $VERSION" --generate-notes --target "$GITHUB_SHA"
            fi
          fi

          # 清掉早期工作流遗留的构建元数据，再上传本次产物
          gh release delete-asset "$VERSION" builder-debug.yml \
            --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release upload "$VERSION" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

appId: com.securepass.desktop
productName: SecurePass
copyright: Copyright (c) 2026 SecurePass Contributors
directories:
  output: release
  buildResources: build
# dist/ 与 dist-electron/ 已经包含渲染层与主进程的全部代码；
# 主进程只把 electron 与 hash-wasm 留作 external（见 dist-electron/main/index.js 的 require），
# 其余依赖（antd / react / zustand …）都被 Vite 打进 dist/assets，无需再随包发布。
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!node_modules/**'
  - node_modules/hash-wasm/package.json
  - node_modules/hash-wasm/dist/**
  - '!**/*.map'
  - '!**/*.md'
  - '!**/{test,tests,__tests__,example,examples,docs}/**'
asar: true
# hash-wasm 在运行时会加载 WebAssembly 模块，放在 asar 外更稳妥。
asarUnpack:
  - node_modules/hash-wasm/dist/**
icon: build/icon.png
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # 签名材料只通过环境变量传入（CSC_LINK / CSC_KEY_PASSWORD，或 Azure 凭据）；
  # 未配置时 electron-builder 会自动跳过签名，产物与配置前一致。见 docs/SIGNING.zh-CN.md。
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    publisherName: SecurePass Contributors
    rfc3161TimeStampServer: http://timestamp.digicert.com
mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  # 公证（notarize）需要在 CI 里显式打开：npm run package -- --config.mac.notarize=true
  # 并配置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID（见 docs/SIGNING.zh-CN.md）。
  # 这里不写死 true，否则没有凭据的构建会直接失败。
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Utility
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish: null
